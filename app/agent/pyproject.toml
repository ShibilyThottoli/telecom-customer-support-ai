[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore ~= 1.22.0",
    "boto3",
    "fastembed",
    "langchain ~= 1.4.0",
    "langchain-groq",
    "langchain-aws ~= 1.7.5",
    "langgraph ~= 1.2.11",
    "opentelemetry-instrumentation-langchain ~= 0.62.3",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
